plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.printwatch'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.printwatch'
        minSdk 24          // Android 7.0+, so older tablets work too
        targetSdk 35
        // Every GitHub build gets a higher number, so the tablet accepts it as an update
        def build = (project.findProperty('buildNumber') ?: '1') as int
        versionCode build
        versionName "1.0.${build}"
    }

    // The signing key file is in the repository, protected by a password that is NOT:
    // GitHub reads it from the KEYSTORE_PASSWORD secret, a local build from local.properties
    // (printwatch.keystorePassword=...). Every build signed with it can update the installed app.
    def localProps = new Properties()
    def lp = rootProject.file('local.properties')
    if (lp.exists()) lp.withInputStream { localProps.load(it) }
    def keystorePassword = System.getenv('PRINTWATCH_KEYSTORE_PASSWORD') ?: localProps.getProperty('printwatch.keystorePassword')

    signingConfigs {
        if (keystorePassword) {
            release {
                storeFile file('../keystore/printwatch.jks')
                storeType 'pkcs12'
                storePassword keystorePassword
                keyAlias 'printwatch'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePassword) {
                signingConfig signingConfigs.release
            } else {
                // Without the password the APK is signed with a throw-away debug key. It installs,
                // but cannot update (or be updated by) the official PrintWatch builds.
                logger.warn('PrintWatch: no keystore password, signing with the debug key')
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
